<!-- Вставлять в существующий раздел «Музыкальные сценарии» после создания плейлистов. -->
<!-- Заменить PLACEHOLDER_* настоящими ID из Spotify; не использовать фиктивные ID в публикации. -->
<section class="spotify-playlists" aria-label="Музыкальные сценарии">
  <div class="spotify-playlist" data-scenario="cooking">
    <h3>Под что готовить</h3>
    <iframe title="Spotify: Под что готовить" src="https://open.spotify.com/embed/playlist/PLACEHOLDER_COOKING" loading="lazy" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" style="border:0;border-radius:12px;width:100%;height:352px"></iframe>
  </div>
  <div class="spotify-playlist" data-scenario="dinner">
    <h3>Под что ужинать</h3>
    <iframe title="Spotify: Под что ужинать" src="https://open.spotify.com/embed/playlist/PLACEHOLDER_DINNER" loading="lazy" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" style="border:0;border-radius:12px;width:100%;height:352px"></iframe>
  </div>
  <div class="spotify-playlist" data-scenario="continue">
    <h3>Под что продолжить</h3>
    <iframe title="Spotify: Под что продолжить" src="https://open.spotify.com/embed/playlist/PLACEHOLDER_CONTINUE" loading="lazy" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" style="border:0;border-radius:12px;width:100%;height:352px"></iframe>
  </div>
</section>
