name: Apply owner-approved headline and grammar fixes
on:
  push:
    branches: [fix/site-grammar-and-headings-20261103]
    paths: ['scripts/fix-owner-copy-20261103.py', '.github/workflows/fix-owner-copy-20261103.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/site-grammar-and-headings-20261103
          persist-credentials: true
      - run: python3 scripts/fix-owner-copy-20261103.py
      - name: Verify scope and commit
        run: |
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' 'full-catalog/index.html' 'index.html')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html full-catalog/index.html
          git commit -m "Fix apple-sage subject grammar and approved headings"
          git push
