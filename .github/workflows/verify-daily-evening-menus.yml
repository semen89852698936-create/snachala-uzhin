name: Verify rotating daily dinner plans
on:
  push:
    branches: [feature/music-bpm-editorial-cards-20261102]
    paths:
      - index.html
      - full-catalog/index.html
      - scripts/verify-daily-evening-menus.cjs
      - .github/workflows/verify-daily-evening-menus.yml
  pull_request:
    paths:
      - index.html
      - full-catalog/index.html
      - scripts/verify-daily-evening-menus.cjs
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: node scripts/verify-daily-evening-menus.cjs
