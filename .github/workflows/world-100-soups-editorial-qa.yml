name: World 100 Soups Editorial QA
on:
  pull_request:
    paths:
      - 'project-operations/soups/**'
      - '.github/workflows/world-100-soups-editorial-qa.yml'
  workflow_dispatch:
jobs:
  editorial-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate 100 recipe cards, portions, steps and distinct source domains
        run: node project-operations/soups/verify-world-100.cjs
      - name: Upload structural QA report (does not verify URLs or photos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-soups-structural-report
          path: project-operations/soups/WORLD_100_QA_REPORT.json
          if-no-files-found: ignore
