name: Vegetables photo visual audit export
on:
  push:
    branches: [audit/vegetables-100-visual-20261117]
    paths: [.github/workflows/vegetables-visual-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export vegetables photos and image metadata
        run: |
          python3 - <<'PY'
          import csv,pathlib,shutil,json,hashlib
          base=pathlib.Path('.')
          photos=json.loads((base/'photo-library/ai-recipe-photo-map.json').read_text(encoding='utf-8'))['photos']
          out=pathlib.Path('vegetables-100')
          out.mkdir(exist_ok=True)
          selected=[]
          for p in photos:
              if p['n'] not in (7,8) and not (413<=p['n']<=510): continue
              src=base/p['path'].lstrip('/')
              if not src.is_file(): raise SystemExit('Missing '+str(src))
              dst=out/src.name
              shutil.copy2(src,dst)
              selected.append(dict(n=p['n'],id=p['recipe_id'],path=p['path'],file=dst.name,sha256=hashlib.sha256(dst.read_bytes()).hexdigest()))
          assert len(selected)==100,len(selected)
          (out/'manifest.json').write_text(json.dumps(selected,ensure_ascii=False,indent=2),encoding='utf-8')
          print('Successfully exported 100 vegetable photos')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vegetables-100-site-photos
          path: vegetables-100/
          retention-days: 7
