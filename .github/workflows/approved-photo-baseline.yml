name: Lock approved recipe photographs
on:
  push:
    branches:
      - ops/photo-baseline-lock-20261119
    paths:
      - 'scripts/verify-approved-photo-baseline.cjs'
      - 'project-operations/APPROVED_PHOTO_BASELINE_20261119.json'
      - 'assets/recipes-ai/**'
      - '.github/workflows/approved-photo-baseline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify owner-approved image bytes
        run: node scripts/verify-approved-photo-baseline.cjs
      - name: Check 1001 recipe photo links
        run: python3 scripts/verify-1001-photo-links.py
