name: Alice AI ART - Cantonese soup 100 correction v4
on:
  push:
    branches:
      - photo-production/alice-art-soup-100-v4-20261121
    paths:
      - .github/workflows/alice-art-soup-100-v4-20261121.yml
      - photo-pipeline/generate_soup100_alice_v4.py
permissions:
  contents: write
concurrency:
  group: alice-soup-100-v4-20261121-one-shot
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: photo-production/alice-art-soup-100-v4-20261121
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: semen89852698936-create/snachala-uzhin
          ref: photo-production/yandex-ai-art-1001
          path: _alice_source
          sparse-checkout: |
            photo-pipeline
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet 'Pillow>=10,<13'
      - name: Reserve then make one paid Alice AI ART image request
        env:
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID || 'b1g00u8p0k5nl98v8nre' }}
          PHOTO_COST_APPROVED: 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python photo-pipeline/generate_soup100_alice_v4.py
