name: Verify AI visual reviews 16-20
on:
  pull_request:
    paths:
      - 'review/ai-art-sixteen-to-twenty-visual-triage-20261102.json'
      - 'photo-library/ai-art-replacement-briefs-18-19-20261102.json'
      - 'photo-library/ai-recipe-photo-map.json'
      - 'tests/ai-art-sixteen-to-twenty-review.test.cjs'
      - '.github/workflows/verify-ai-visual-review-16-20.yml'
  push:
    branches: [photo-library/ai-visual-review-16-20-20261102]
    paths:
      - 'review/ai-art-sixteen-to-twenty-visual-triage-20261102.json'
      - 'photo-library/ai-art-replacement-briefs-18-19-20261102.json'
      - 'photo-library/ai-recipe-photo-map.json'
      - 'tests/ai-art-sixteen-to-twenty-review.test.cjs'
      - '.github/workflows/verify-ai-visual-review-16-20.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --test tests/ai-art-sixteen-to-twenty-review.test.cjs
