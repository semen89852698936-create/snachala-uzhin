name: Unified editorial rollout QA
on:
  pull_request:
    paths:
      - 'assets/editorial-unified-20261106.css'
      - 'index.html'
      - 'full-catalog/index.html'
      - 'scripts/test_unified_editorial.cjs'
      - '.github/workflows/unified-editorial.yml'
permissions:
  contents: read
jobs:
  editorial-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - run: node scripts/test_unified_editorial.cjs
