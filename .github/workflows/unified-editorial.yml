name: Unified editorial rollout QA
on:
  pull_request:
    paths:
      - 'assets/editorial-unified-20261106.css'
      - 'index.html'
      - 'full-catalog/index.html'
      - 'scripts/test_unified_editorial.cjs'
      - 'scripts/e2e-unified-editorial.cjs'
      - 'scripts/e2e-airfryer-paper-buttons.cjs'
      - 'scripts/e2e-editorial-home.cjs'
      - 'scripts/e2e-visual-rhythm.cjs'
      - 'scripts/e2e-pepper-steak-editorial.cjs'
      - 'scripts/e2e-evening-editorial.cjs'
      - '.github/workflows/unified-editorial.yml'
# Replace obsolete PR checks instead of accumulating long-running browsers.
concurrency:
  group: editorial-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  editorial-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - run: node scripts/test_unified_editorial.cjs
      - name: Install pinned Playwright
        run: npm install --no-package-lock --no-save playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser check desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/unified-editorial-http.log 2>&1 &
          timeout --signal=TERM --kill-after=10s 180s node scripts/e2e-airfryer-paper-buttons.cjs
          timeout --signal=TERM --kill-after=10s 180s node scripts/e2e-unified-editorial.cjs
          timeout --signal=TERM --kill-after=10s 180s node scripts/e2e-visual-rhythm.cjs
          timeout --signal=TERM --kill-after=10s 180s node scripts/e2e-editorial-home.cjs
          timeout --signal=TERM --kill-after=10s 180s node scripts/e2e-pepper-steak-editorial.cjs
          timeout --signal=TERM --kill-after=10s 240s node scripts/e2e-evening-editorial.cjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unified-editorial-phase1-screenshots
          path: |
            /tmp/unified-*.png
            /tmp/editorial-home-*.png
            /tmp/editorial-rhythm-home-*.png
            /tmp/editorial-catalog-*.png
            /tmp/editorial-pepper-*.png
            /tmp/editorial-evening-*.png
          if-no-files-found: ignore
