name: Verify old Timeweb app removed after migration (READ ONLY)
on:
  pull_request:
    branches: [feature/commerce-secure-foundation-20261104]
    paths: ['.github/workflows/timeweb-post-retirement-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    if: github.event.pull_request.number == 135 && github.event.pull_request.head.ref == 'deploy/commerce-timeweb-staging-20261106' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check Timeweb app list shows exactly one remaining commerce server
        env:
          TIMEWEB_API_TOKEN: ${{ secrets.TIMEWEB_API_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,time,urllib.request,urllib.error
          token=os.environ.get('TIMEWEB_API_TOKEN','').strip()
          if token.lower().startswith('bearer '):token=token[7:].strip()
          if len(token)>2 and token[0]==token[-1] and token[0] in ("'",'"'):token=token[1:-1].strip()
          if not token:raise SystemExit('Token not found')
          headers={'Authorization':'Bearer '+token,'Accept':'application/json'}
          root='https://api.timeweb.cloud'
          def get(path):
              req=urllib.request.Request(root+path,headers=headers,method='GET')
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:return r.status,json.load(r)
              except urllib.error.HTTPError as e:return e.code,{}
          for attempt in range(6):
              code,data=get('/api/v1/apps')
              if code!=200:raise SystemExit('BLOCK: cannot verify Timeweb app inventory')
              allapps=data.get('apps')
              if not isinstance(allapps,list):raise SystemExit('BLOCK: malformed app list')
              matches=[a for a in allapps if isinstance(a,dict) and a.get('id') in (284041,284043)]
              print('MATCHED COMMERCE APP IDS',sorted(a.get('id') for a in matches))
              old=[a for a in matches if a.get('id')==284041]
              new=[a for a in matches if a.get('id')==284043]
              if len(new)!=1:raise SystemExit('BLOCK: target new app missing')
              if new[0].get('name')!='snachala-uzhin-commerce-private' or new[0].get('preset_id')!=2731 or new[0].get('project_id')!=3145267 or new[0].get('status')!='active':
                  raise SystemExit('BLOCK: new private app identity/plan invalid')
              if not old:
                  print('SUCCESS: old 284041 absent from Timeweb app list; new 284043 active. No duplicate App Platform monthly plan.')
                  break
              print('Old app still listed, status',old[0].get('status'))
              if attempt==5:
                  raise SystemExit('PENDING: old app still listed; remove not yet confirmed')
              time.sleep(8)
          print('READ ONLY: No paid resources changed.')
          PY
