name: Diagnose Timeweb PostgreSQL startup from redacted app log categories
on:
  pull_request:
    branches: [feature/commerce-secure-foundation-20261104]
    paths: ['.github/workflows/timeweb-postgres-log-triage.yml']
permissions:
  contents: read
jobs:
  inspect:
    if: github.event.pull_request.number == 135 && github.event.pull_request.head.ref == 'deploy/commerce-timeweb-staging-20261106' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get logs and print only classified nonsecret diagnostic flags
        env:
          TIMEWEB_API_TOKEN: ${{ secrets.TIMEWEB_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json,os,re,urllib.request,urllib.error
          token=os.environ.get('TIMEWEB_API_TOKEN','').strip()
          if token.lower().startswith('bearer '):token=token[7:].strip()
          if len(token)>2 and token[0]==token[-1] and token[0] in ("'",'"'):token=token[1:-1].strip()
          if not token:raise SystemExit('BLOCK: token missing')
          headers={'Authorization':'Bearer '+token,'Accept':'application/json'}
          url='https://api.timeweb.cloud/api/v1/apps/284043'
          req=urllib.request.Request(url,headers=headers)
          with urllib.request.urlopen(req,timeout=20) as f:app=json.load(f)['app']
          if (app.get('id'),app.get('name'),app.get('project_id'),app.get('preset_id'))!=(284043,'snachala-uzhin-commerce-private',3145267,2731):raise SystemExit('BLOCK: app mismatch')
          req=urllib.request.Request(url+'/logs',headers=headers)
          try:
              with urllib.request.urlopen(req,timeout=25) as f:
                  status=f.status; raw=f.read(700000)
          except urllib.error.HTTPError as e:
              print('LOGS_ACCESS_HTTP',e.code)
              raise SystemExit(0)
          print('LOGS_ACCESS_HTTP',status,'RESPONSE_BYTES',len(raw))
          obj=json.loads(raw)
          print('LOG_JSON_TOP_KEYS',sorted(obj.keys()) if isinstance(obj,dict) else type(obj).__name__)
          text=json.dumps(obj,ensure_ascii=False).lower()
          tags={
            'pg_password_auth':('password authentication failed','invalidpassword','28p01'),
            'pg_auth_host':('no pg_hba.conf entry','pg_hba'),
            'pg_network':('connection refused','network is unreachable','no route to host','connection timed out'),
            'pg_dns':('could not translate host name','name or service not known'),
            'pg_ssl':('ssl error','ssl handshake','sslmode','tls'),
            'pg_connect_error':('psycopg.operationalerror','psycopg.errors','postgres_db.py'),
            'pg_schema_error':('syntax error','relation','permission denied for schema'),
            'gunicorn_worker_failed':('worker failed to boot','worker exiting','shutting down','haltserver'),
            'missing_env':('missing commerce_database_url','missing commerce_db_path','missing session_key_hex'),
            'timeout':('timeout','timed out'),
            'generic_error':('traceback','error','exception')
          }
          for name,needles in tags.items():print('LOG_CLASS',name,any(term in text for term in needles))
          items=obj.get('app_logs',[]) if isinstance(obj,dict) else []
          print('LOG_ENTRY_COUNT',len(items) if isinstance(items,list) else 'not-list')
          if isinstance(items,list):
              for i in [0,1,-2,-1]:
                  if len(items)<2 and abs(i)>1:continue
                  entry=items[i]
                  t=str(entry.get('created_at',entry.get('timestamp',''))) if isinstance(entry,dict) else ''
                  value=json.dumps(entry,ensure_ascii=False).lower()
                  print('ENTRY_POSITION',i,'TIME',t[:32] if re.fullmatch(r'[0-9TZ:\\+\\.\\-]*',t[:32]) else '(hidden)',
                        'AUTH_ERROR',('password authentication failed' in value or '28p01' in value),
                        'SSL_ERROR',('ssl error' in value or 'ssl handshake' in value),
                        'WORKER_FAILED','worker failed to boot' in value)
              matches=[i for i,x in enumerate(items) if 'password authentication failed' in json.dumps(x,ensure_ascii=False).lower()]
              print('AUTH_ERROR_ENTRIES',len(matches),'FIRST_INDEX',matches[0] if matches else 'none','LAST_INDEX',matches[-1] if matches else 'none')
          print('LOG_CONTENT_NEVER_PRINTED')
          PY
