name: Publish remaining two egg-free turkey photos
on:
  push:
    branches: [main]
    paths:
      - 'scripts/publish-poultry-two-20261103.py'
      - '.github/workflows/publish-poultry-two.yml'
  workflow_dispatch:
  schedule:
    - cron: '10,40 * * * *'
permissions:
  contents: write
concurrency:
  group: yandex-poultry-two-20261103
  cancel-in-progress: false
jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 57
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/checkout@v4
        with:
          repository: semen89852698936-create/snachala-uzhin
          ref: photo-production/yandex-ai-art-1001
          path: _photo_source
          sparse-checkout: |
            photo-pipeline
            photo-library/recipes.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Generate two missing photos, save paid request checkpoints, publish immediately
        env:
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID || 'b1g00u8p0k5nl98v8nre' }}
          PHOTO_COST_APPROVED: 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 scripts/publish-poultry-two-20261103.py
          python3 scripts/verify-1001-photo-links.py
