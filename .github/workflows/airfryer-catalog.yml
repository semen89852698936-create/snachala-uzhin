name: Airfryer catalog QA
on:
  pull_request:
    paths:
      - 'data/airfryer-recipes-batch-*.json'
      - 'assets/airfryer/**'
      - 'assets/airfryer-catalog.js'
      - 'index.html'
      - 'full-catalog/index.html'
      - 'scripts/test-airfryer-catalog.cjs'
      - '.github/workflows/airfryer-catalog.yml'
  push:
    branches: [main]
    paths:
      - 'data/airfryer-recipes-batch-*.json'
      - 'assets/airfryer/**'
      - 'assets/airfryer-catalog.js'
      - 'index.html'
      - 'full-catalog/index.html'
      - 'scripts/test-airfryer-catalog.cjs'
      - '.github/workflows/airfryer-catalog.yml'
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate airfryer recipes, photos and both site variants
        run: node scripts/test-airfryer-catalog.cjs
