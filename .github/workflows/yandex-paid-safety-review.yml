name: Verify Yandex paid-workflow safety
on:
  pull_request:
    paths:
      - '.github/workflows/yandex-ai-1001.yml'
      - '.github/workflows/yandex-paid-safety-review.yml'
      - 'tests/test_yandex_paid_workflow_gate.py'
  push:
    branches:
      - safety/manual-only-yandex-photo-cost-20261102
    paths:
      - '.github/workflows/yandex-ai-1001.yml'
      - '.github/workflows/yandex-paid-safety-review.yml'
      - 'tests/test_yandex_paid_workflow_gate.py'
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_yandex_paid_workflow_gate.py' -v
