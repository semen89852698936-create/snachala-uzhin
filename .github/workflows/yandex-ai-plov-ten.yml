name: Alice AI ART - ten plov photos (unpublished review)

on:
  push:
    branches: ['feat/plov-ten-editorial-20261113']
    paths:
      - '.github/workflows/yandex-ai-plov-ten.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plov-ten-photos-once-20261113
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node scripts/test-plov-10.cjs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<13'
      - run: python -m py_compile photo-pipeline/generate_plov_batch.py
      - run: python photo-pipeline/generate_plov_batch.py --limit 10

  generate:
    needs: validate
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat/plov-ten-editorial-20261113' }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/plov-ten-editorial-20261113
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Check secrets before any paid calls
        env:
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID || 'b1g00u8p0k5nl98v8nre' }}
        run: |
          test -n "$YANDEX_API_KEY" || { echo "::error::YANDEX_API_KEY is not configured. No paid requests were made."; exit 1; }
          test -n "$YANDEX_FOLDER_ID"
      - name: Switch to separate unpublished photo-production branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin photo-production/plov-ten-20261113 >/dev/null 2>&1; then
            git fetch origin photo-production/plov-ten-20261113
            git checkout -B photo-production/plov-ten-20261113 origin/photo-production/plov-ten-20261113
          else
            git checkout -b photo-production/plov-ten-20261113
          fi
      - name: Reserve, generate and checkpoint at most ten photos, never publishing to main
        shell: bash
        env:
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID || 'b1g00u8p0k5nl98v8nre' }}
          PHOTO_COST_APPROVED: 'true'
        run: |
          set -euo pipefail
          for number in $(seq 1 10); do
            echo "Processing photo number $number/10"
            python photo-pipeline/generate_plov_batch.py --start "$number" --end "$number" --limit 1 --reserve-only
            git add -A photo-library/plov
            if ! git diff --cached --quiet; then
              git commit -m "plov photos: reserve paid request $number/10 before calling API"
              git push origin HEAD:refs/heads/photo-production/plov-ten-20261113
            fi
            set +e
            python photo-pipeline/generate_plov_batch.py --start "$number" --end "$number" --limit 1 --execute
            result=$?
            set -e
            git add -A assets/plov photo-library/plov
            if ! git diff --cached --quiet; then
              git commit -m "plov photos: checkpoint photo $number/10 and its provenance"
              git push origin HEAD:refs/heads/photo-production/plov-ten-20261113
            fi
            if [ "$result" -ne 0 ]; then
              echo "::error::Image $number failed or is uncertain. Do not auto-retry this paid request."
              exit "$result"
            fi
          done
          echo "Ten photo candidates saved on separate production branch. OWNER VISUAL REVIEW REQUIRED."
