name: Fix paprika and garlic cooking-step grammar
on:
  push:
    branches: [fix/recipe-paprika-garlic-grammar-20261112]
    paths: ['.github/workflows/fix-paprika-garlic-grammar-20261112.yml']
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Replace inaccurate imperative in both recipe catalogs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old = 'Добавь паприкой и чесноком'
          new = 'Приправь паприкой и чесноком'
          total = 0
          for name in ('index.html', 'full-catalog/index.html'):
              p = Path(name)
              data = p.read_text(encoding='utf-8')
              count = data.count(old)
              print(f'{name}: {count} occurrences')
              if count != 2:
                  raise SystemExit(f'Unexpected number of occurrences in {name}: {count}')
              total += count
              p.write_text(data.replace(old, new), encoding='utf-8')
              assert p.read_text(encoding='utf-8').count(old) == 0
              assert p.read_text(encoding='utf-8').count(new) == 2
          assert total == 4, f'Expected 4 instances, got {total}'
          PY
      - name: Commit exact textual fix
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html full-catalog/index.html
          git diff --cached --quiet && exit 1
          git commit -m "fix(recipes): Приправь паприкой и чесноком in both catalogs"
          git push
