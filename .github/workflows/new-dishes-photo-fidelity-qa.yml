name: Photo fidelity v2 - seven revised new-dishes images (free validation)
on:
  push:
    branches: ['fix/new-dishes-source-photo-fidelity-20261113']
    paths:
      - '.github/workflows/new-dishes-photo-fidelity-qa.yml'
      - 'data/ten-new-dishes-editorial.json'
      - 'data/new-dishes-photo-fidelity-v2.json'
      - 'scripts/test-new-dishes-photo-fidelity-v2.cjs'
      - 'assets/new-dishes/review-v2/**'
      - 'photo-library/new-dishes/review-v2/records/**'
  pull_request:
    paths:
      - 'data/ten-new-dishes-editorial.json'
      - 'data/new-dishes-photo-fidelity-v2.json'
      - 'scripts/test-new-dishes-photo-fidelity-v2.cjs'
      - 'assets/new-dishes/review-v2/**'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node scripts/test-new-dishes-photo-fidelity-v2.cjs
