name: Air fryer 100-recipe editorial plan
on:
  pull_request:
    paths:
      - 'data/airfryer-100-editorial-plan.json'
      - 'scripts/test-airfryer-100-plan.cjs'
      - 'data/airfryer-recipes-batch-01.json'
      - 'data/airfryer-recipes-batch-02.json'
      - 'data/airfryer-recipes-batch-03.json'
      - 'data/airfryer-recipes-batch-04.json'
      - 'data/airfryer-recipes-batch-05.json'
      - 'data/airfryer-recipes-batch-06.json'
      - 'data/airfryer-recipes-batch-07.json'
      - 'scripts/test-airfryer-batch-03.cjs'
      - 'scripts/test-airfryer-batch-04.cjs'
      - 'scripts/test-airfryer-batch-05.cjs'
      - 'scripts/test-airfryer-batch-06.cjs'
      - 'scripts/test-airfryer-batch-07.cjs'
      - 'project-operations/airfryer/BATCH_03_MEAT_QA.md'
      - 'project-operations/airfryer/BATCH_04_MIXED_QA.md'
      - 'project-operations/airfryer/BATCH_05_SEAFOOD_QA.md'
      - 'project-operations/airfryer/BATCH_06_SEAFOOD_VEGETABLES_QA.md'
      - 'project-operations/airfryer/BATCH_07_VEGETABLES_QA.md'
      - 'scripts/test-airfryer-batch-02.cjs'
      - 'project-operations/airfryer/BATCH_02_POULTRY_QA.md'
      - 'photo-pipeline/**'
      - 'project-operations/airfryer/BATCH_01_YANDEX_PHOTO_PIPELINE.md'
      - '.github/workflows/airfryer-100-plan.yml'
      - '.github/workflows/yandex-ai-airfryer-batch-01.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate exact 100-recipe scope, unique IDs and category balance
        run: node scripts/test-airfryer-100-plan.cjs
      - name: Validate second ten-recipe poultry batch
        run: node scripts/test-airfryer-batch-02.cjs
      - name: Validate third ten-recipe meat batch
        run: node scripts/test-airfryer-batch-03.cjs
      - name: Validate fourth mixed meat-and-fish batch
        run: node scripts/test-airfryer-batch-04.cjs
      - name: Validate fifth seafood batch
        run: node scripts/test-airfryer-batch-05.cjs
      - name: Validate sixth seafood and vegetables batch
        run: node scripts/test-airfryer-batch-06.cjs
      - name: Validate seventh vegetables batch
        run: node scripts/test-airfryer-batch-07.cjs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install image validation dependency for free prompt tests
        run: python -m pip install 'Pillow>=10,<13'
      - name: Compile and dry-run Yandex photo generator without paid API calls
        run: |
          python -m py_compile photo-pipeline/generate_airfryer_batch.py photo-pipeline/test_airfryer_batch.py photo-pipeline/verify_airfryer_batch.py
          for manifest in data/airfryer-recipes-batch-*.json; do
            [ -f "$manifest" ] || continue
            python photo-pipeline/test_airfryer_batch.py --manifest "$manifest"
          done
