name: Airfryer 100 photo parity
on:
  push:
    branches:
      - 'qa/airfryer-photo-parity-rebased-20261108'
    paths:
      - '.github/workflows/airfryer-photo-parity.yml'
      - 'scripts/test-airfryer-photo-parity.cjs'
  pull_request:
    paths:
      - 'assets/airfryer/**'
      - 'photo-library/airfryer/records/**'
      - 'data/airfryer-recipes-batch-*.json'
      - 'scripts/test-airfryer-photo-parity.cjs'
      - '.github/workflows/airfryer-photo-parity.yml'
  workflow_dispatch:
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-airfryer-photo-parity.cjs
