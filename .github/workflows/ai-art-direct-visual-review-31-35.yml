name: Verify direct AI food-photo review 31-35
on:
  push:
    branches:
      - photo-library/ai-visual-review-31-35-20261103
  pull_request:
    paths:
      - 'photo-library/ai-art-direct-visual-review-31-35-20261103.json'
      - 'tests/test_ai_art_direct_visual_review_31_35.cjs'
      - 'photo-library/ai-recipe-photo-map.json'
      - '.github/workflows/ai-art-direct-visual-review-31-35.yml'
permissions:
  contents: read
jobs:
  review-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - run: node tests/test_ai_art_direct_visual_review_31_35.cjs
