name: Full product acceptance - desktop and mobile
on:
  pull_request:
    paths:
      - '.github/workflows/full-product-acceptance.yml'
      - 'index.html'
      - 'full-catalog/index.html'
      - 'assets/editorial-unified-20261106.css'
      - 'scripts/e2e-pantry-search.cjs'
      - 'scripts/e2e-cooking-timer.cjs'
      - 'scripts/e2e-unified-editorial.cjs'
      - 'scripts/e2e-editorial-home.cjs'
      - 'scripts/e2e-pepper-steak-editorial.cjs'
      - 'scripts/e2e-evening-editorial.cjs'
      - 'scripts/test_pantry_quantities.cjs'
      - 'scripts/test_cooking_timer.cjs'
      - 'scripts/test_unified_editorial.cjs'
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Install pinned Playwright
        run: npm install --no-package-lock --no-save playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Source-level regression tests
        run: |
          node scripts/test_pantry_quantities.cjs
          node scripts/test_cooking_timer.cjs
          node scripts/test_unified_editorial.cjs
      - name: Start local storefront and run real browser acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/full-product-acceptance-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8765/ >/dev/null
          node scripts/e2e-pantry-search.cjs
          node scripts/e2e-cooking-timer.cjs
          node scripts/e2e-unified-editorial.cjs
          node scripts/e2e-editorial-home.cjs
          node scripts/e2e-pepper-steak-editorial.cjs
          node scripts/e2e-evening-editorial.cjs
      - name: Preserve screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: full-product-acceptance
          path: |
            /tmp/full-product-acceptance-http.log
            /tmp/pantry-*.png
            /tmp/cooking-*.png
            /tmp/unified-*.png
            /tmp/editorial-*.png
            /tmp/airfryer-timing-*.png
          if-no-files-found: ignore
          retention-days: 14
