name: Commerce foundation tests
on:
  pull_request:
    paths:
      - 'commerce/**'
      - 'scripts/e2e-commerce-account.cjs'
      - 'scripts/smoke-commerce-http.py'
      - 'Dockerfile.commerce'
      - '.dockerignore'
      - 'Dockerfile.commerce'
      - '.github/workflows/commerce-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s commerce -p 'test_*.py' -v

      - run: python -m compileall -q commerce
      - run: python commerce/private_catalog.py index.html /tmp/commerce-test-private/app.html
      - run: test -s /tmp/commerce-test-private/app.html

  buyer-account-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Test My Access page on desktop and phone
        run: |
          python3 -m http.server 8777 --bind 127.0.0.1 --directory commerce/public > /tmp/commerce-account-http.log 2>&1 &
          sleep 2
          node scripts/e2e-commerce-account.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: commerce-account-desktop-mobile
          path: exports/commerce-account-*.png
          if-no-files-found: ignore

  commerce-docker-http:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build isolated protected commerce container
        run: docker build --file Dockerfile.commerce --tag snachala-commerce-ci .
      - name: Run container with disposable payments database and checkout disabled
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/su-commerce-db"
          sudo chown 10001:10001 "$RUNNER_TEMP/su-commerce-db"
          docker run --detach --name su-commerce-ci \
            --publish 127.0.0.1:8788:8080 \
            --volume "$RUNNER_TEMP/su-commerce-db:/srv/data" \
            --env COMMERCE_BASE_URL=https://staging.example \
            --env COMMERCE_DB_PATH=/srv/data/orders.sqlite \
            --env SESSION_KEY_HEX=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
            --env ENABLE_CHECKOUT=0 \
            snachala-commerce-ci
          docker cp scripts/smoke-commerce-http.py su-commerce-ci:/tmp/smoke-commerce-http.py
          docker exec \
            --env PYTHONPATH=/srv/site \
            --env COMMERCE_TEST_MODE=1 \
            su-commerce-ci python /tmp/smoke-commerce-http.py
      - name: Diagnose failed staging container
        if: failure()
        run: docker logs su-commerce-ci --tail 80 || true
      - name: Remove disposable staging resources
        if: always()
        run: docker rm -f su-commerce-ci >/dev/null 2>&1 || true

  postgres-store:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: su_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d su_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      COMMERCE_TEST_POSTGRES: '1'
      COMMERCE_PG_SSLMODE: disable
      COMMERCE_TEST_POSTGRES_DSN: postgresql://postgres:local-ci-only@127.0.0.1:5432/su_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install 'psycopg[binary]==3.3.6'
      - run: python -m unittest commerce.test_postgres_store -v
