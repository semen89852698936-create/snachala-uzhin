name: Commerce foundation tests
on:
  pull_request:
    paths:
      - 'commerce/**'
      - 'scripts/e2e-commerce-account.cjs'
      - '.github/workflows/commerce-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s commerce -p 'test_*.py' -v

      - run: python -m compileall -q commerce
      - run: python commerce/private_catalog.py index.html /tmp/commerce-test-private/app.html
      - run: test -s /tmp/commerce-test-private/app.html

  buyer-account-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Test My Access page on desktop and phone
        run: |
          python3 -m http.server 8777 --bind 127.0.0.1 --directory commerce/public > /tmp/commerce-account-http.log 2>&1 &
          sleep 2
          node scripts/e2e-commerce-account.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: commerce-account-desktop-mobile
          path: exports/commerce-account-*.png
          if-no-files-found: ignore
