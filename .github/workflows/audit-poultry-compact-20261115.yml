name: Compact published poultry QA sheets for manual visual review
on:
  push:
    branches:
      - audit/poultry-published-20261115
    paths:
      - .github/workflows/audit-poultry-compact-20261115.yml
permissions:
  contents: write
jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/poultry-published-20261115
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet 'Pillow>=10,<13'
      - run: python3 audit/poultry-published-20261115/compress_audit.py
      - name: Preserve compressed inspection images in audit branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/poultry-published-20261115/*-compact.jpg
          git diff --cached --check
          git commit -m 'audit: compress five poultry photo sheets and four live browser screenshots'
          git push origin HEAD:refs/heads/audit/poultry-published-20261115
