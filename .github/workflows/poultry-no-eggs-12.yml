name: Regenerate 12 poultry recipe photo candidates (owner-requested)
on:
  push:
    branches:
      - photo-production/poultry-no-eggs-12-20261103
    paths:
      - '.github/workflows/poultry-no-eggs-12.yml'
      - 'photo-library/poultry-no-eggs-regeneration-queue-20261103.json'
      - 'photo-pipeline/regenerate_poultry_candidates.py'
      - 'photo-pipeline/test_regenerate_poultry_candidates.py'
permissions:
  contents: write
concurrency:
  group: owner-requested-poultry-no-eggs-12
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<13'
      - run: python photo-pipeline/regenerate_poultry_candidates.py --check
      - run: python -m unittest discover -s photo-pipeline -p 'test_regenerate_poultry_candidates.py' -v
  produce:
    needs: check
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/photo-production/poultry-no-eggs-12-20261103' }}
    runs-on: ubuntu-latest
    timeout-minutes: 59
    env:
      YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
      YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID || 'b1g00u8p0k5nl98v8nre' }}
      PHOTO_COST_APPROVED: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: photo-production/poultry-no-eggs-12-20261103
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Generate at most 14 paid candidates with Git-pushed reservations
        shell: bash
        run: |
          set -euo pipefail
          python photo-pipeline/regenerate_poultry_candidates.py --check
          if [[ -z "${YANDEX_API_KEY}" || -z "${YANDEX_FOLDER_ID}" ]]; then
            echo "::error::Missing Yandex secret; no paid requests were sent"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for n in 147 148 149 150 151 153 155 156 168 169 173 176; do
            outcome=$(python photo-pipeline/regenerate_poultry_candidates.py --reserve "$n")
            echo "$outcome"
            if [[ "$outcome" != "RESERVED ${n}" ]]; then
              continue
            fi
            git add -A photo-library/poultry-no-eggs-regeneration-20261103
            git commit -m "Reserve poultry recipe ${n} before one paid Yandex request"
            git push origin HEAD:refs/heads/photo-production/poultry-no-eggs-12-20261103
            set +e
            python photo-pipeline/regenerate_poultry_candidates.py --perform "$n"
            result=$?
            set -e
            git add -A photo-library/poultry-no-eggs-regeneration-20261103
            if ! git diff --cached --quiet; then
              git commit -m "Checkpoint AI poultry candidate ${n} (unpublished)"
              git push origin HEAD:refs/heads/photo-production/poultry-no-eggs-12-20261103
            fi
            if [[ "$result" -ne 0 ]]; then
              echo "::error::Paid request uncertain or processing failed for ${n}; no retry"
              exit "$result"
            fi
          done
          echo "REGENERATION_JOB_FINISHED: results are candidates only; originals unchanged."
