name: Audit Russian licensed tracks BPM (not a publication)
on:
  push:
    branches:
      - feat/russian-licensed-playlists-20261112
    paths:
      - music/russian-licensed-intake-20261112.json
      - scripts/analyze-russian-music-bpm.py
      - .github/workflows/analyze-russian-music.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out without write permission
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install tempo detector
        run: |
          python -m pip install --disable-pip-version-check --quiet librosa==0.11.0 numpy==2.2.6
          ffmpeg -version | head -n 1
      - name: Calculate BPM and confidence without publishing
        run: python -u scripts/analyze-russian-music-bpm.py
      - name: Retain measurements for independent review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: russian-music-bpm-audit
          path: /tmp/russian-music-bpm-audit.json
          if-no-files-found: ignore
