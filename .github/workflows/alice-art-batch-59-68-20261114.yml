name: Alice AI ART - photo candidates 59 through 68 (single paid call each)
on:
  push:
    branches:
      - photo-production/alice-art-approved-series-58-20261114
    paths:
      - .github/workflows/alice-art-batch-59-68-20261114.yml
permissions:
  contents: write
concurrency:
  group: alice-art-batch-59-68-20261114
  cancel-in-progress: false
jobs:
  generate-ten-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 59
    steps:
      - name: Checkout isolated photo review branch
        uses: actions/checkout@v4
        with:
          ref: photo-production/alice-art-approved-series-58-20261114
          fetch-depth: 0
          persist-credentials: true
      - name: Checkout established Alice AI ART adapter (read-only)
        uses: actions/checkout@v4
        with:
          repository: semen89852698936-create/snachala-uzhin
          ref: photo-production/yandex-ai-art-1001
          path: _photo_source
          sparse-checkout: |
            photo-pipeline
            photo-library/recipes.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image encoder
        run: python -m pip install --quiet 'Pillow>=10,<13'
      - name: Generate and checkpoint one image per recipe; never publish to site
        shell: bash
        env:
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID || 'b1g00u8p0k5nl98v8nre' }}
          PHOTO_COST_APPROVED: 'true'
        run: |
          set -euo pipefail
          test -n "${YANDEX_API_KEY:-}" || { echo "::error::No YANDEX_API_KEY set"; exit 1; }
          test -n "${YANDEX_FOLDER_ID:-}" || { echo "::error::No YANDEX_FOLDER_ID set"; exit 1; }
          python3 - <<'PY'
          import hashlib
          import importlib.util
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          branch='photo-production/alice-art-approved-series-58-20261114'
          base=Path('photo-library/alice-art-series-59-68-20261114')
          plan=json.loads((base/'plan.json').read_text(encoding='utf-8'))
          recipes=json.loads(Path('_photo_source/photo-library/recipes.json').read_text(encoding='utf-8'))['recipes']
          by_n={int(r['n']):r for r in recipes}
          items=plan['items']
          assert len(items)==10
          assert [int(r['photo_number']) for r in items]==list(range(59,69))
          assert plan['max_paid_requests']==10 and plan['cost_approved_by_user_for_10_generations'] is True
          for item in items:
              recipe=by_n[int(item['recipe_n'])]
              assert recipe['id']==item['recipe_id'] and recipe['title'].replace('с сливками','со сливками')==item['title'], item
              assert 1<=len(item['prompt'])<=500
              assert item['publish_to_site'] is False

          spec=importlib.util.spec_from_file_location('alice_adapter','_photo_source/photo-pipeline/generate_yandexart.py')
          ym=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(ym)
          def git(*args):
              subprocess.run(['git',*args],check=True)
          git('config','user.name','github-actions[bot]')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          unresolved=[]
          done=0
          for item in items:
              n=int(item['photo_number'])
              stem=f"{n:04d}-{item['recipe_id']}"
              image=base/'candidates'/f'{stem}.webp'
              record=base/'records'/f'{stem}.json'
              pending=base/'pending'/f'{stem}.json'
              if image.exists() and record.exists():
                  obj=json.loads(record.read_text(encoding='utf-8'))
                  assert hashlib.sha256(image.read_bytes()).hexdigest()==obj['sha256']
                  print(f'EXISTING_OK {n}',flush=True)
                  done+=1
                  continue
              if image.exists()!=record.exists():
                  raise RuntimeError(f'Partial file and record: {n}, no duplicate API call')
              if pending.exists():
                  print(f'UNRESOLVED_PRIOR_PAID_REQUEST {n}; not paying twice',flush=True)
                  unresolved.append(n)
                  continue
              assert os.environ['PHOTO_COST_APPROVED']=='true'
              reservation={'photo_number':n,'recipe_id':item['recipe_id'],
                  'status':'one_paid_request_started_never_auto_retry',
                  'prompt':item['prompt'],'at':datetime.now(timezone.utc).isoformat()}
              ym.atomic_write(pending,json.dumps(reservation,ensure_ascii=False,indent=2).encode('utf-8'))
              git('add',str(pending))
              git('commit','-m',f'Alice AI ART: reserve photo {n} before paid image API request')
              git('push','origin','HEAD:refs/heads/'+branch)
              raw=ym.request_image(item['prompt'],os.environ['YANDEX_API_KEY'],os.environ['YANDEX_FOLDER_ID'])
              webp=ym.encode_webp(raw)
              digest=hashlib.sha256(webp).hexdigest()
              ym.atomic_write(image,webp)
              metadata={'photo_number':n,'recipe_n':item['recipe_n'],
                'recipe_id':item['recipe_id'],'title':item['title'],
                'model':'aliceai-image-art-3.0','prompt':item['prompt'],
                'sha256':digest,'bytes':len(webp),'size':[1200,900],
                'status':'candidate_owner_approval_required',
                'site_published':False,'created_at':datetime.now(timezone.utc).isoformat()}
              ym.atomic_write(record,json.dumps(metadata,ensure_ascii=False,indent=2).encode('utf-8'))
              pending.unlink()
              git('add','-A',str(base/'pending'),str(base/'records'),str(base/'candidates'))
              git('diff','--cached','--check')
              git('commit','-m',f'Alice AI ART: save candidate photo {n} for owner review (not published)')
              git('push','origin','HEAD:refs/heads/'+branch)
              print(f'SAVED_CANDIDATE {n} sha256={digest} bytes={len(webp)}',flush=True)
              done+=1
          print(f'FINAL_BULK_STATUS done={done}/10 unresolved={unresolved}',flush=True)
          if unresolved:
              raise RuntimeError(f'Unresolved paid requests, no automatic retry: {unresolved}')
          assert done==10
          PY
