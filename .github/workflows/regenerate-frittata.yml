name: Regenerate authentic frittata image (single paid request)
on:
  push:
    branches: [fix/frittata-authentic-photo-20261103]
    paths:
      - 'photo-pipeline/regenerate_frittata.py'
      - '.github/workflows/regenerate-frittata.yml'
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Generate one replacement candidate in Yandex AI
        env:
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}
          PHOTO_COST_APPROVED: 'true'
        run: python photo-pipeline/regenerate_frittata.py
      - name: Commit candidate for visual review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photo-library/frittata-review
          git diff --cached --quiet && exit 1
          git commit -m "Generate frittata replacement without fried egg garnish"
          git push
