name: Verify photo pipeline
on:
  pull_request:
    paths:
      - 'photo-pipeline/**'
      - 'photo-library/**'
      - '.github/workflows/photo-pipeline.yml'
      - '.github/workflows/photo-pipeline-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install Pillow for image-pipeline unit tests (no API calls)
        run: python3 -m pip install 'Pillow>=10,<13'
      - name: Python syntax check
        run: python3 -m py_compile photo-pipeline/worker.py photo-pipeline/test_worker.py
      - name: Mocked unit tests (no API calls)
        run: python3 -m unittest discover -s photo-pipeline -p 'test_*.py' -v
      - name: Verify complete manifest and dry-run queue
        run: python3 photo-pipeline/worker.py --manifest photo-library/recipes.json --max-per-run 10 --max-total 50
