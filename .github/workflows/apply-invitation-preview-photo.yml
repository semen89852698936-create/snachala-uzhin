name: Apply approved Our Evening photo to invitation preview
on:
  push:
    branches: [feature/evening-invitation-table-photo-20261101]
    paths: ['.github/workflows/apply-invitation-preview-photo.yml', 'scripts/apply-user-approved-evening-photo.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact preview branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feature/evening-invitation-table-photo-20261101
          fetch-depth: 0
          persist-credentials: true
      - run: python3 -m pip install --quiet Pillow==11.3.0
      - name: Replace only old cooking-together image and obsolete credit
        run: python3 scripts/apply-user-approved-evening-photo.py
      - name: Verify all 1001 recipes, selected image, and JavaScript
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          from PIL import Image
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script id="recipeData" type="application/json">([\s\S]*?)</script>',s)
          assert m, "Missing recipe data"
          data=json.loads(m.group(1))
          assert len(data)==1001 and len(set(r['id'] for r in data))==1001
          assert s.count('src="assets/our-evening-together-approved.webp"')==1
          assert 'src="assets/cooking-together-romantic.avif"' not in s
          assert 'Готовить вместе -<br><em>значит быть рядом.</em>' in s
          assert 'du-evening-role-grid' in s
          assert 'eveningInviteName' in s
          with Image.open('assets/our-evening-together-approved.webp') as im:
              assert im.format=='WEBP' and im.size==(1080,1350)
          for n,(attrs,js) in enumerate(re.findall(r'<script([^>]*)>(.*?)</script>',s,re.S)):
              if 'application/json' in attrs or 'src=' in attrs or not js.strip(): continue
              Path('/tmp/our-evening-script-'+str(n)+'.js').write_text(js,encoding='utf-8')
          print('PASS: selected photo + 1001 recipes + preserved Our Evening')
          PY
          for p in /tmp/our-evening-script-*.js; do node --check "$p"; done
      - name: Commit verified update to the targeted branch
        run: |
          set -euo pipefail
          git add index.html photo-library/our-evening-user-approved-image.json
          git -c user.name='approved-photo[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Replace blurry photo in requested Our Evening preview page'
          git push origin HEAD:refs/heads/feature/evening-invitation-table-photo-20261101
