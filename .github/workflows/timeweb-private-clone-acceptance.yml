name: Private Timeweb clone live acceptance with locked checkout
on:
  pull_request:
    branches: [feature/commerce-secure-foundation-20261104]
    paths: ['.github/workflows/timeweb-private-clone-acceptance.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.number == 135 && github.event.pull_request.head.ref == 'deploy/commerce-timeweb-staging-20261106' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Test actual HTTPS / paid-catalog protection / disabled orders
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json,time
          origin='https://semen89852698936-create-snachala-uzhin-9f50.twc1.net'
          def check(path,method='GET',payload=None):
              headers={}
              body=None
              if method=='POST':
                  headers={'Origin':origin,'Content-Type':'application/json'}
                  body=json.dumps(payload).encode()
              q=urllib.request.Request(origin+path,method=method,headers=headers,data=body)
              try:
                  with urllib.request.urlopen(q,timeout=15) as r:return r.status,r.read(10000)
              except urllib.error.HTTPError as err:return err.code,err.read(10000)
          expected={'/healthz':200,'/':200,'/account':200,'/api/me':200,
                    '/app':403,'/full-catalog/index.html':403,
                    '/assets/recipes-ai/0001-lemon-spinach-pasta.webp':403}
          for trial in range(5):
              errors=[]
              for path,code in expected.items():
                  try:
                      actual,body=check(path)
                      print(path,'HTTP',actual,'expected',code)
                      if actual!=code:errors.append(path)
                      if path=='/api/me' and actual==200:
                          if json.loads(body).get('has_access') is not False:errors.append('anonymous-has-access')
                  except Exception as e:
                      print(path,'NETWORK',type(e).__name__)
                      errors.append(path)
              try:
                  s,b=check('/api/orders','POST',{'email':'readiness-nonbuyer@example.invalid'})
                  print('/api/orders HTTP',s)
                  if s!=503 or b'checkout_not_enabled' not in b:errors.append('checkout-must-be-off')
              except Exception as e:
                  print('orders NETWORK',type(e).__name__)
                  errors.append('orders')
              if not errors:
                  print('PASS: NEW PRIVATE CLONE on HTTPS, protected catalog and images, checkout OFF.')
                  break
              if trial==4:raise SystemExit('FAIL: '+','.join(errors))
              time.sleep(10)
          PY
