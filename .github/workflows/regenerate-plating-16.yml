name: Recreate 16 owner-flagged recipe photos with Yandex
on:
  push:
    branches: [main]
    paths: ['scripts/regenerate-plating-16.py', '.github/workflows/regenerate-plating-16.yml']
  pull_request:
    paths: ['scripts/regenerate-plating-16.py', '.github/workflows/regenerate-plating-16.yml']
  workflow_dispatch:
  schedule:
    - cron: '15,45 * * * *'
permissions:
  contents: write
concurrency:
  group: yandex-plating-16
  cancel-in-progress: false
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/checkout@v4
        with:
          repository: semen89852698936-create/snachala-uzhin
          ref: photo-production/yandex-ai-art-1001
          path: _photo_source
          sparse-checkout: |
            photo-pipeline
            photo-library/recipes.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Validate recipe mapping without paid calls
        run: python3 scripts/regenerate-plating-16.py --dry-run
      - name: Generate safe candidates (never replace live photos)
        if: github.event_name != 'pull_request'
        env:
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID || 'b1g00u8p0k5nl98v8nre' }}
          PHOTO_COST_APPROVED: 'true'
        run: |
          set +e
          python3 scripts/regenerate-plating-16.py
          status=$?
          set -e
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            if [ -d photo-library/regeneration-20261103 ]; then git add -- photo-library/regeneration-20261103; fi
            if ! git diff --cached --quiet; then
              git diff --cached --check
              git commit -m "Save recipe-photo regeneration candidates"
              git push origin HEAD:refs/heads/main
            fi
          fi
          exit "$status"
