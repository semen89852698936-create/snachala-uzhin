name: Build frozen 20 recipe photo pairing ZIP packages
on:
  push:
    branches: ['handoff/20-recipe-photo-pairs-20261114']
    paths:
      - '.github/workflows/build-20-recipe-handoff-zips.yml'
      - 'scripts/build_recipe_handoff_archives.py'
permissions:
  contents: write
concurrency:
  group: handoff-20-pairs-zips-one-shot-20261114
  cancel-in-progress: false
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: handoff/20-recipe-photo-pairs-20261114
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify source photo blobs and build three ZIP archives
        run: python scripts/build_recipe_handoff_archives.py
      - name: Confirm precisely 20 distinct image/recipe pairs
        shell: bash
        run: |
          set -euo pipefail
          (cd handoff/2026-11-14 && sha256sum -c SHA256SUMS.txt)
          ls -lh handoff/2026-11-14/*.zip
      - name: Commit ZIP exports to the isolated handoff branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add handoff/2026-11-14/*.zip handoff/2026-11-14/SHA256SUMS.txt handoff/2026-11-14/ARCHIVE_REPORT.json
          if ! git diff --cached --quiet; then
            git commit -m "archive: attach verified plov and new-dishes ZIP bundles (20 pairs)"
            git push origin HEAD:refs/heads/handoff/20-recipe-photo-pairs-20261114
          fi
