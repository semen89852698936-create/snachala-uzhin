name: Verify selected recipe photos 41-45
on:
  push:
    branches:
      - qa/recipe-photo-41-45-source-guard-20261103
  pull_request:
    paths:
      - 'tests/recipe-photo-41-45-source-guard.test.cjs'
      - 'photo-library/ai-recipe-photo-map.json'
      - 'assets/recipes-ai/**'
      - '.github/workflows/verify-recipe-photo-41-45.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/recipe-photo-41-45-source-guard.test.cjs
