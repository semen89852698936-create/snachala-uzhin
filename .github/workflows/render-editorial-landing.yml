name: Editorial landing comparison (no deploy)
on:
  pull_request:
    paths:
      - 'landing-editorial.html'
      - 'scripts/render-editorial-landing.cjs'
      - '.github/workflows/render-editorial-landing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Render approved baseline and editorial variants
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/editorial-http.log 2>&1 &
          sleep 2
          node scripts/render-editorial-landing.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: success()
        with:
          name: editorial-landing-before-after
          path: exports/snachala-*.png
          if-no-files-found: error
