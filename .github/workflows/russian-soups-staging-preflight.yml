name: Russian soups 10 staging preflight (no photo import)
on:
  push:
    branches:
      - release/nash-vecher-russian-soups-10-20261119
    paths:
      - index.html
      - full-catalog/index.html
      - assets/world-soups-10.js
      - scripts/check-world-soups-release.cjs
      - .github/workflows/russian-soups-staging-preflight.yml
permissions:
  contents: read
jobs:
  content-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify soup recipe data and both catalog variants
        run: node scripts/check-world-soups-release.cjs --content-only
