name: Audit Russian headings and recipe grammar
on:
  push:
    branches: [fix/russian-proofreading-20261103]
    paths: [scripts/audit-russian-site.py, .github/workflows/audit-russian-site.yml]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/russian-proofreading-20261103
          persist-credentials: true
      - run: python3 scripts/audit-russian-site.py
      - name: Save diagnosis to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/russian-editorial-diagnostics-20261103.json
          git diff --cached --quiet && exit 0
          git commit -m "Audit punctuation and grammar in both site variants"
          git push origin HEAD:refs/heads/fix/russian-proofreading-20261103
