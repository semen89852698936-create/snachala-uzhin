name: Editorial and license release gate (no image rehash)
on:
  pull_request:
    paths:
      - 'scripts/photo-release-gate.mjs'
      - 'tests/photo-release-gate.test.mjs'
      - 'tests/replacement-briefs.test.mjs'
      - 'scripts/extract-rejected-recipe-data.mjs'
      - 'review/replacement-briefs-20261102.json'
      - 'review/commons-source-page-evidence-20261102.json'
      - 'review/photo-release-decisions.json'
      - 'review/visual-triage-20261102.json'
      - 'review/visual-triage-addendum-20261102-1042.json'
      - 'review/visual-triage-addendum-20261102-1140.json'
      - 'tests/visual-triage-27-30.test.mjs'
      - 'tests/visual-triage-33-36.test.mjs'
      - 'review/visual-triage-addendum-20261102-1543.json'
      - 'photo-library/batch-100-20261101/manifest.json'
      - '.github/workflows/editorial-release-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run offline editorial gate tests
        run: node --test tests/photo-release-gate.test.mjs
      - name: Verify rejected-photo briefs against actual recipe ingredients
        run: node --test tests/replacement-briefs.test.mjs
      - name: Extract exact catalog ingredients for unbriefed visual rejects
        run: node scripts/extract-rejected-recipe-data.mjs
      - name: Check new visual triage against immutable archive
        run: node --test tests/visual-triage-27-30.test.mjs
      - name: Verify new direct WebP triage 33 34 36 against immutable manifest
        run: node --test tests/visual-triage-33-36.test.mjs
      - name: Audit release ledger without reading image bytes
        run: node scripts/photo-release-gate.mjs
