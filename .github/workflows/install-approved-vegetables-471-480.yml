name: Install 10 approved champignon photos on approved baseline
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download owner-approved archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/approved
          gh release download vegetables-471-480 --repo "${{ github.repository }}" --pattern '*.zip' --dir /tmp/approved
          test "$(find /tmp/approved -maxdepth 1 -name '*.zip' -type f | wc -l)" -eq 1
          find /tmp/approved -maxdepth 1 -name '*.zip' -type f -exec cp '{}' /tmp/vegetables.zip \;
          echo 'd8d0f111043f653bf230eb31c87ba7e63599a864669ea316d6fa3c0801884e99  /tmp/vegetables.zip' | sha256sum -c -
      - name: Validate 10 approvals and update only their WebPs and checksums
        run: |
          python3 - <<'PY'
          import zipfile,json,pathlib,hashlib
          z=zipfile.ZipFile('/tmp/vegetables.zip')
          assert z.testzip() is None
          rows=json.loads(z.read('manifest.json'))
          assert len(rows)==10 and {int(r['n']) for r in rows}==set(range(471,481))
          target=pathlib.Path('photo-library/ai-recipe-photo-map.json')
          original=target.read_text(encoding='utf-8')
          info=json.loads(original)
          assert len(info['photos'])==1001
          for r in rows:
              n=int(r['n']); p=info['photos'][n-1]
              assert p['n']==n and p['recipe_id']==r['recipe_id'] and p['path'].lstrip('/')==r['repo_path']
              assert pathlib.PurePosixPath(r['repo_path']).parts[:2]==('assets','recipes-ai')
              filename='НОВЫЕ_10_WEBP/'+r['file']
              assert r['file']==pathlib.PurePosixPath(r['repo_path']).name
              data=z.read(filename)
              assert len(data)==int(r['bytes']) and hashlib.sha256(data).hexdigest()==r['sha256']
              assert data[:4]==b'RIFF' and data[8:12]==b'WEBP'
              original_path=pathlib.Path(r['repo_path'])
              assert original_path.is_file()
              original_path.write_bytes(data)
              p['bytes']=len(data)
              p['sha']=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          target.write_text(json.dumps(info,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          expected={r['repo_path'] for r in rows}|{'photo-library/ai-recipe-photo-map.json'}
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only']).decode().splitlines())
          assert changed==expected,('Unexpected changed files',changed^expected)
          print('Validated all 10 approved mushrooms; only the 10 WebPs and the metadata file changed.')
          PY
      - name: Full photo and site integrity QA
        run: python3 scripts/verify-1001-photo-links.py
      - name: Commit to protected staging branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/recipes-ai/*.webp photo-library/ai-recipe-photo-map.json
          git diff --cached --check
          git commit -m 'photos(vegetables): 10 approved cooked champignon photographs'
          git push origin HEAD:automation/vegetables-471-480-approved-2026-11-17
