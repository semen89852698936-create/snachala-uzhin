name: Russian soups editorial QA
on:
  pull_request:
    paths:
      - 'project-operations/soups/**'
      - '.github/workflows/russian-soups-editorial-qa.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node project-operations/soups/verify-russian-10.cjs
