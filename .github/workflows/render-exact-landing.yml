name: Exact landing PNG (browser screenshot)
on:
  push:
    branches: [design/exact-landing-png-20261104]
    paths:
      - '.github/workflows/render-exact-landing.yml'
      - 'scripts/render-exact-landing.cjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Serve real repository landing and capture
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/landing-server.log 2>&1 &
          sleep 3
          node scripts/render-exact-landing.cjs
      - name: Commit exact PNG screenshot to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exports/snachala-uzhin-landing-exact-desktop.png
          git commit -m "capture: actual PR #39 landing at 1440px in Chromium" || exit 0
          git push
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exact-landing-png
          path: exports/snachala-uzhin-landing-exact-desktop.png
