name: Screenshot current salmon recipe card
on:
  push:
    branches:
      - qa/salmon-recipe-card-capture-20261111
permissions:
  contents: read
jobs:
  live-recipe-card:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Capture actual live recipe (desktop and phone)
        run: node scripts/qa-salmon-card-20261111.cjs
      - name: Attach images and recipe metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: actual-salmon-card-20261111
          path: |
            /tmp/salmon-card-*.png
            /tmp/salmon-card-details.json
          if-no-files-found: error
