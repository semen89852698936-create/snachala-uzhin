name: Yandex AI ART - air fryer photo batch 01
on:
  push:
    branches: [main]
    paths:
      - 'data/airfryer-recipes-batch-01.json'
      - 'photo-pipeline/generate_airfryer_batch.py'
      - '.github/workflows/yandex-ai-airfryer-batch-01.yml'
  pull_request:
    paths:
      - 'data/airfryer-recipes-batch-01.json'
      - 'photo-pipeline/**'
      - '.github/workflows/yandex-ai-airfryer-batch-01.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      paid_generation:
        description: 'Set yes to run paid Yandex generation'
        required: true
        default: 'no'
        type: choice
        options: ['no', 'yes']
permissions:
  contents: write
concurrency:
  group: yandex-ai-airfryer-batch-01
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Compile photo pipeline scripts
        run: python -m py_compile photo-pipeline/generate_airfryer_batch.py photo-pipeline/test_airfryer_batch.py photo-pipeline/verify_airfryer_batch.py
      - name: Validate recipe-specific prompts without paid API calls
        run: python photo-pipeline/test_airfryer_batch.py
      - name: Dry-run all ten prompts without paid API calls
        run: python photo-pipeline/generate_airfryer_batch.py --start 1 --end 10 --limit 10

  generate:
    needs: preflight
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.paid_generation == 'yes') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Prepare persistent unpublished photo-production branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if git ls-remote --exit-code --heads origin photo-production/airfryer-batch-01-20261107 >/dev/null 2>&1; then
            git fetch origin photo-production/airfryer-batch-01-20261107
            git checkout -B photo-production/airfryer-batch-01-20261107 origin/photo-production/airfryer-batch-01-20261107
            git merge --no-edit origin/main
          else
            git checkout -b photo-production/airfryer-batch-01-20261107 origin/main
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Validate prompts and existing checkpoints
        run: python photo-pipeline/test_airfryer_batch.py
      - name: Generate up to ten recipe-specific WebP files, checkpointing each paid response
        env:
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID || 'b1g00u8p0k5nl98v8nre' }}
          PHOTO_COST_APPROVED: 'true'
        run: python photo-pipeline/generate_airfryer_batch.py --start 1 --end 10 --limit 10 --execute
      - name: Verify image dimensions, WebP format, metadata and SHA-256
        run: python photo-pipeline/verify_airfryer_batch.py
      - name: Save verified photos to the unpublished production branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "No new air-fryer photos or metadata to checkpoint."
          else
            git commit -m "Yandex AI ART: save air-fryer poultry batch 01 photos"
            git push origin HEAD:refs/heads/photo-production/airfryer-batch-01-20261107
          fi
