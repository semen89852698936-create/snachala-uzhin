name: Yandex AI ART - air fryer 100-recipe photo production
on:
  push:
    branches: [main]
    paths:
      - 'data/airfryer-recipes-batch-*.json'
      - 'photo-pipeline/generate_airfryer_batch.py'
      - '.github/workflows/yandex-ai-airfryer-batch-01.yml'
  pull_request:
    paths:
      - 'data/airfryer-recipes-batch-*.json'
      - 'photo-pipeline/**'
      - '.github/workflows/yandex-ai-airfryer-batch-01.yml'
  schedule:
    - cron: '*/5 * * * *' # temporary cadence for the three owner-approved replacements
  workflow_dispatch:
    inputs:
      paid_generation:
        description: 'Set yes to run paid Yandex generation'
        required: true
        default: 'no'
        type: choice
        options: ['no', 'yes']
permissions:
  contents: write
concurrency:
  group: yandex-ai-airfryer-100-photo-production
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Compile photo pipeline scripts
        run: python -m py_compile photo-pipeline/generate_airfryer_batch.py photo-pipeline/test_airfryer_batch.py photo-pipeline/verify_airfryer_batch.py
      - name: Free prompt preflight and dry-run for every available ten-recipe batch
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for manifest in data/airfryer-recipes-batch-*.json; do
            [ -f "$manifest" ] || continue
            found=1
            echo "Preflight: $manifest"
            python photo-pipeline/test_airfryer_batch.py --manifest "$manifest"
          done
          test "$found" -eq 1

  generate:
    needs: preflight
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.paid_generation == 'yes') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Prepare persistent unpublished photo-production branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin photo-production/airfryer-batch-01-20261107 >/dev/null 2>&1; then
            git fetch origin photo-production/airfryer-batch-01-20261107
            git checkout -B photo-production/airfryer-batch-01-20261107 origin/photo-production/airfryer-batch-01-20261107
            git merge --no-edit origin/main
          else
            git checkout -b photo-production/airfryer-batch-01-20261107 origin/main
          fi
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Generate the first incomplete batch, at most ten paid images per run
        shell: bash
        env:
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID || 'b1g00u8p0k5nl98v8nre' }}
          PHOTO_COST_APPROVED: 'true'
        run: |
          set -euo pipefail
          found=0
          for manifest in data/airfryer-recipes-batch-*.json; do
            [ -f "$manifest" ] || continue
            found=1
            echo "Processing $manifest"
            summary=$(python photo-pipeline/generate_airfryer_batch.py --manifest "$manifest" --limit 10 --execute)
            echo "$summary"
            base=$(basename "$manifest" .json)
            python photo-pipeline/verify_airfryer_batch.py --manifest "$manifest" --progress-file "progress-$base.json"
            summary_json=$(printf '%s\n' "$summary" | tail -n 1)
            created=$(python -c 'import json,sys; print(json.loads(sys.argv[1])["created_or_prepared"])' "$summary_json")
            refused=$(python -c 'import json,sys; print(json.loads(sys.argv[1])["refused"])' "$summary_json")
            if [ "$created" -gt 0 ] || [ "$refused" -gt 0 ]; then
              echo "Stopping after the first incomplete or blocked batch; the next scheduled run will resume here."
              break
            fi
          done
          test "$found" -eq 1
      - name: Save verified photos to the unpublished production branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "No new air-fryer photos or metadata to checkpoint."
          else
            git commit -m "Yandex AI ART: checkpoint next air-fryer photo batch"
            git push origin HEAD:refs/heads/photo-production/airfryer-batch-01-20261107
          fi
