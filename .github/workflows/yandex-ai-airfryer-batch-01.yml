name: Yandex AI ART - air fryer 100-recipe photo production
on:
  pull_request:
    branches: [main]
    paths:
      - 'data/airfryer-recipes-batch-*.json'
      - 'data/airfryer-100-editorial-plan.json'
      - 'photo-library/airfryer/visual-review.json'
      - 'photo-pipeline/**'
      - '.github/workflows/yandex-ai-airfryer-batch-01.yml'
  workflow_dispatch:
    inputs:
      paid_generation:
        description: 'Set yes to run paid Yandex generation'
        required: true
        default: 'no'
        type: choice
        options: ['no', 'yes']
permissions:
  contents: read
concurrency:
  group: yandex-ai-airfryer-100-photo-production
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Compile photo pipeline scripts
        run: python -m py_compile photo-pipeline/generate_airfryer_batch.py photo-pipeline/test_airfryer_batch.py photo-pipeline/verify_airfryer_batch.py photo-pipeline/verify_airfryer_catalog.py
      - name: Free prompt preflight for every ten-recipe batch
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for manifest in data/airfryer-recipes-batch-*.json; do
            [ -f "$manifest" ] || continue
            found=1
            echo "Preflight: $manifest"
            python photo-pipeline/test_airfryer_batch.py --manifest "$manifest"
          done
          test "$found" -eq 1
      - name: Verify all 100 existing WebP files and review records
        run: python photo-pipeline/verify_airfryer_catalog.py --require-all-images

  generate:
    needs: preflight
    if: ${{ (github.event_name == 'pull_request' && github.head_ref == 'feature/airfryer-photo-regeneration-20261108' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && inputs.paid_generation == 'yes') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Generate only explicitly reviewed replacements across all ten batches
        shell: bash
        env:
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID || 'b1g00u8p0k5nl98v8nre' }}
          PHOTO_COST_APPROVED: 'true'
        run: |
          set -euo pipefail
          TARGET_BRANCH="${{ github.head_ref || github.ref_name }}"
          git fetch origin "$TARGET_BRANCH"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          found=0
          for manifest in data/airfryer-recipes-batch-*.json; do
            [ -f "$manifest" ] || continue
            found=1
            echo "Reviewing replacements in $manifest"
            summary=$(python photo-pipeline/generate_airfryer_batch.py --manifest "$manifest" --limit 10 --execute)
            echo "$summary"
            base=$(basename "$manifest" .json)
            python photo-pipeline/verify_airfryer_batch.py --manifest "$manifest" --progress-file "progress-$base.json"
          done
          test "$found" -eq 1
          python photo-pipeline/verify_airfryer_catalog.py --require-all-images --sync-manifests --sync-plan --write-progress
          git add -A
          if git diff --cached --quiet; then
            echo "No replacement images were generated."
          else
            git commit -m "Yandex AI ART: regenerate visually rejected air fryer photos"
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          fi
