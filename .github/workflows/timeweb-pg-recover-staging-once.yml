name: Recover existing private staging availability after PostgreSQL auth rejection (once)
on:
  pull_request:
    branches: [feature/commerce-secure-foundation-20261104]
    paths: ['.github/workflows/timeweb-pg-recover-staging-once.yml']
permissions:
  contents: read
concurrency:
  group: timeweb-pg-staging-recovery-284043
  cancel-in-progress: false
jobs:
  recover:
    if: github.event.pull_request.number == 135 && github.event.pull_request.head.ref == 'deploy/commerce-timeweb-staging-20261106' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restore known-safe staging configuration without creating or deleting resources
        env:
          TIMEWEB_API_TOKEN: ${{ secrets.TIMEWEB_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json,os,secrets,time,urllib.request,urllib.error
          t=os.getenv('TIMEWEB_API_TOKEN','').strip()
          if t.lower().startswith('bearer '):t=t[7:].strip()
          if len(t)>2 and t[0]==t[-1] and t[0] in ("'",'"'):t=t[1:-1].strip()
          assert t
          base='https://api.timeweb.cloud/api/v1/apps/284043'
          host='semen89852698936-create-snachala-uzhin-9f50.twc1.net'
          headers={'Authorization':'Bearer '+t,'Content-Type':'application/json','Accept':'application/json'}
          def api(method,body=None):
              req=urllib.request.Request(base,data=json.dumps(body).encode() if body is not None else None,headers=headers,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=25) as f:return f.status,json.load(f)
              except urllib.error.HTTPError as e:return e.code,{}
          code,r=api('GET')
          if code!=200:raise SystemExit('BLOCK: app API read failed')
          app=r.get('app',{})
          if any((app.get('id')!=284043,app.get('name')!='snachala-uzhin-commerce-private',
                  app.get('project_id')!=3145267,app.get('preset_id')!=2731,app.get('location')!='ru-3',
                  app.get('branch')!='deploy/commerce-timeweb-staging-20261106',
                  app.get('commit_sha')!='130c7319d27a307b1865150a7782422d95d9459c')):
              raise SystemExit('BLOCK: wrong app')
          env=app.get('envs',{})
          expected={'COMMERCE_BASE_URL','COMMERCE_DB_PATH','SESSION_KEY_HEX','ENABLE_CHECKOUT','COMMERCE_PAYMENT_QA_APPROVED','COMMERCE_DATABASE_URL'}
          if not isinstance(env,dict) or set(env)!=expected:raise SystemExit('BLOCK: unexpected app keys')
          replacement={'COMMERCE_BASE_URL':'https://'+host,
                       'COMMERCE_DB_PATH':'/srv/data/orders.sqlite',
                       'SESSION_KEY_HEX':secrets.token_hex(32),
                       'ENABLE_CHECKOUT':'0',
                       'COMMERCE_PAYMENT_QA_APPROVED':'0'}
          code,r=api('PATCH',{'envs':replacement})
          if code not in (200,202):raise SystemExit('BLOCK: Timeweb rejected safe recovery')
          print('RECOVERED CONFIG: removed unusable DB DSN only on staging app 284043, checkout 0.')
          code,r=api('GET')
          if code!=200 or set(r.get('app',{}).get('envs',{}))!=set(replacement):raise SystemExit('BLOCK: could not confirm restored settings')
          print('READBACK: approved five keys only. No secrets logged.')
          origin='https://'+host
          for step in range(12):
              try:
                  with urllib.request.urlopen(origin+'/healthz',timeout=12) as f:status=f.status
              except urllib.error.HTTPError as e:status=e.code
              except Exception as e:status=type(e).__name__
              print('HTTP_CHECK',step,status)
              if status==200:
                  print('PASS: protected staging website responds; production checkout still disabled.')
                  break
              if step==11:raise SystemExit('BLOCK: staging not recovered; logs inspection required')
              time.sleep(6)
          PY
