name: Yandex AI ART 1001 recipe photographs

on:
  push:
    branches: [photo-production/yandex-ai-art-1001]
    paths:
      - 'photo-pipeline/generate_yandexart.py'
      - 'photo-pipeline/test_yandexart.py'
      - '.github/workflows/yandex-ai-1001.yml'
  workflow_dispatch:
    inputs:
      paid_generation:
        description: 'Set yes to run a paid batch'
        required: true
        default: 'no'
        type: choice
        options: ['no', 'yes']
  # Scheduled triggers are active only after this workflow is added to main.
  schedule:
    - cron: '7,37 * * * *'

concurrency:
  group: yandex-art-1001-recipe-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: photo-production/yandex-ai-art-1001
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<13'
      - run: python -m unittest discover -s photo-pipeline -p 'test_yandexart.py' -v
      - name: Preview first 10 prompts without API calls
        run: python photo-pipeline/generate_yandexart.py --start 1 --end 10 --limit 10

  produce:
    needs: check
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.paid_generation == 'yes') }}
    runs-on: ubuntu-latest
    timeout-minutes: 59
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: photo-production/yandex-ai-art-1001
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Generate up to 10, committing each successful WebP before the next paid request
        shell: bash
        env:
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID || 'b1g00u8p0k5nl98v8nre' }}
          PHOTO_COST_APPROVED: 'true'
        run: |
          set -euo pipefail
          if [[ -z "${YANDEX_API_KEY}" ]]; then
            echo "::warning::YANDEX_API_KEY is not configured; no paid calls made."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for run_number in $(seq 1 10); do
            set +e
            python3 photo-pipeline/generate_yandexart.py --start 1 --end 1001 --limit 1 --execute
            result=$?
            set -e
            git add -A photo-library/alice-ai-art
            if ! git diff --cached --quiet; then
              git commit -m "Yandex AI ART: save generated WebP and metadata (batch slot ${run_number})"
              git push origin HEAD:refs/heads/photo-production/yandex-ai-art-1001
            else
              echo 'All available recipes already generated, or no new file was produced.'
              break
            fi
            if [[ "${result}" -ne 0 ]]; then
              echo "::warning::Generation stopped after an error. The pending record was checkpointed."
              break
            fi
          done
          echo "Generated images remain unpublished until owner inspects the complete set."
