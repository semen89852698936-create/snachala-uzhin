name: Yandex AI ART 1001 recipe photographs

on:
  push:
    branches: [main, photo-production/yandex-ai-art-1001]
    paths:
      - 'photo-pipeline/generate_yandexart.py'
      - 'photo-pipeline/test_yandexart.py'
      - '.github/workflows/yandex-ai-1001.yml'
  workflow_dispatch:
    inputs:
      paid_generation:
        description: 'Set yes to run a paid batch'
        required: true
        default: 'no'
        type: choice
        options: ['no', 'yes']
  # Final 1001-image audit: reserved single-shot recovery for 10 refused fruit salads and interrupted soup #546.
  # Scheduled triggers are active only after this workflow is added to main.
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'

concurrency:
  group: yandex-art-1001-recipe-production
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: photo-production/yandex-ai-art-1001
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<13'
      - run: python -m unittest discover -s photo-pipeline -p 'test_*.py' -v
      - name: Verify generated WebP files, metadata and hashes without any API calls
        run: python photo-pipeline/verify_yandex_photo_library.py
      - name: Preview first 10 prompts without API calls
        run: python photo-pipeline/generate_yandexart.py --start 1 --end 10 --limit 10

  produce:
    needs: check
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.paid_generation == 'yes') }}
    runs-on: ubuntu-latest
    timeout-minutes: 59
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: photo-production/yandex-ai-art-1001
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Record start count for safe self-continuation
        shell: bash
        run: |
          set -euo pipefail
          count=$(find photo-library/alice-ai-art/photos -maxdepth 1 -type f -name '*.webp' 2>/dev/null | wc -l || true)
          echo "PHOTO_BATCH_START_COUNT=${count//[[:space:]]/}" >> "$GITHUB_ENV"
          echo "Starting with ${count} physical WebP files"
      - name: Generate up to 25, checkpoint each successful WebP before the next paid request
        shell: bash
        env:
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID || 'b1g00u8p0k5nl98v8nre' }}
          PHOTO_COST_APPROVED: 'true'
        run: |
          set -euo pipefail
          if [[ -z "${YANDEX_API_KEY}" ]]; then
            echo "::error::YANDEX_API_KEY is not configured; no paid calls made."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for run_number in $(seq 1 25); do
            set +e
            python3 photo-pipeline/generate_yandexart.py --start 1 --end 1001 --limit 1 --execute
            result=$?
            set -e
            git add -A photo-library/alice-ai-art
            if ! git diff --cached --quiet; then
              git commit -m "Yandex AI ART: save generated WebP and metadata (batch slot ${run_number})"
              git push origin HEAD:refs/heads/photo-production/yandex-ai-art-1001
            else
              echo 'All available recipes already generated, or no new file was produced.'
              break
            fi
            if [[ "${result}" -ne 0 ]]; then
              echo "::error::Generation failed after a paid request or API error. Checkpoint saved; job must be marked failed."
              exit "${result}"
            fi
          done
          # One-shot recovery of rejected recipe photos, using a distinct fruit-
          # specific prompt. Reserve and PUSH each paid request intent first.
          # If a process/network crashes, the reservation blocks future retries.
          for recover_kind in refused uncertain; do
            recover_limit=10
            if [[ "${recover_kind}" == "uncertain" ]]; then
              recover_limit=1
            fi
            for recovery_slot in $(seq 1 "${recover_limit}"); do
              python3 photo-pipeline/recover_missing_yandexart.py --kind "${recover_kind}" --prepare --reservation /tmp/recovery-photo-id.txt
              if [[ "$(cat /tmp/recovery-photo-id.txt)" == "NONE" ]]; then
                break
              fi
              git add -A photo-library/alice-ai-art
              git commit -m "Yandex AI ART: reserve one-time ${recover_kind} recovery before paid request"
              git push origin HEAD:refs/heads/photo-production/yandex-ai-art-1001
              set +e
              python3 photo-pipeline/recover_missing_yandexart.py --kind "${recover_kind}" --perform --reservation /tmp/recovery-photo-id.txt
              recovery_result=$?
              set -e
              git add -A photo-library/alice-ai-art
              if ! git diff --cached --quiet; then
                git commit -m "Yandex AI ART: checkpoint one-time ${recover_kind} recovery result"
                git push origin HEAD:refs/heads/photo-production/yandex-ai-art-1001
              fi
              if [[ "${recovery_result}" -ne 0 ]]; then
                echo "::error::Recovery request result is uncertain; reservation preserved, and auto retry prohibited."
                exit "${recovery_result}"
              fi
            done
          done
          # Generate a checkpoint from actual files, not from number of API calls.
          python3 photo-pipeline/verify_yandex_photo_library.py --write
          git add photo-library/alice-ai-art/progress.json
          if ! git diff --cached --quiet; then
            git commit -m "Yandex AI ART: verify progress by WebP and SHA-256"
            git push origin HEAD:refs/heads/photo-production/yandex-ai-art-1001
          fi
          echo "Generated images remain unpublished until owner inspects the complete set."
      - name: Dispatch the next paid batch only after verified progress
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path("photo-library/alice-ai-art/progress.json").read_text(encoding="utf-8"))
          complete = data["verified_webp"]
          start = int(os.environ["PHOTO_BATCH_START_COUNT"])
          if data["problem_count"]:
              raise SystemExit("Unsafe to auto-continue: invalid WebP or metadata")
          if data["uncertain_paid_requests"]:
              print(f"NOTICE: {data['uncertain_paid_requests']} interrupted response(s) preserved for separate billing-safe recovery")
          if complete >= 1001:
              print(f"COMPLETE: {complete}/1001 verified; stopping")
              Path("/tmp/yandex_continue").write_text("no")
          elif complete > start:
              print(f"Verified progress {start} -> {complete}; dispatching next batch")
              Path("/tmp/yandex_continue").write_text("yes")
          else:
              print(f"NO_NEW_PHOTOS: {start} -> {complete}; no auto-dispatch, preserved all recovery markers")
              Path("/tmp/yandex_continue").write_text("no")
          PY
          if [[ "$(cat /tmp/yandex_continue)" == "yes" ]]; then
            curl --fail-with-body --silent --show-error --retry 3 \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GH_REPOSITORY}/actions/workflows/yandex-ai-1001.yml/dispatches" \
              -d '{"ref":"main","inputs":{"paid_generation":"yes"}}'
            echo "NEXT_BATCH_DISPATCHED"
          fi
