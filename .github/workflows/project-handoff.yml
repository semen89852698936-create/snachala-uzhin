name: Check operational handoff
on:
  push:
    branches: ['operations/**']
    paths: ['project-operations/**', 'scripts/check-operations.py', '.github/workflows/project-handoff.yml']
  pull_request:
    paths: ['project-operations/**', 'scripts/check-operations.py', '.github/workflows/project-handoff.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 scripts/check-operations.py
