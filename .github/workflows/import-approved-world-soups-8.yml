name: Import eight owner-approved photos for Russian soups (staging)
on:
  push:
    branches:
      - release/nash-vecher-russian-soups-10-20261119
    paths:
      - photo-import/soups-01-08.zip
permissions:
  contents: write
concurrency:
  group: approved-russian-soups-8-photo-import
  cancel-in-progress: false
jobs:
  import-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: release/nash-vecher-russian-soups-10-20261119
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Decode exactly eight owner-approved photos with SHA-256 and dimension checks
        run: python scripts/import-world-soups-zip.py
      - name: Verify both HTML catalog variants and all ten physical WebP photographs
        run: node scripts/check-world-soups-release.cjs
      - name: Save approved assets on staging branch only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/world-soups
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m 'Import and verify eight owner-approved Russian soup photographs'
            git push origin HEAD:refs/heads/release/nash-vecher-russian-soups-10-20261119
          else
            echo 'All eight photos already identical. No mutation.'
          fi
