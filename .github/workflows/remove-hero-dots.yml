name: Remove hero headline and slogan punctuation
on:
  push:
    branches:
      - fix/remove-hero-uzhin-dot-20261103
    paths:
      - 'scripts/remove_hero_dots.py'
      - '.github/workflows/remove-hero-dots.yml'
permissions:
  contents: write
concurrency:
  group: remove-hero-dots
  cancel-in-progress: false
jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout release branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/remove-hero-uzhin-dot-20261103
          persist-credentials: true
      - name: Remove exactly two dots from both site variants
        run: python3 scripts/remove_hero_dots.py
      - name: Verify all recipe image links and original catalog size
        run: python3 scripts/verify-1001-photo-links.py
      - name: Ensure only two HTML files changed
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' 'full-catalog/index.html' 'index.html')"
          if [[ "$changed" != "$expected" ]]; then
            echo "::error::Unexpected changed files"
            printf '%s\n' "$changed"
            exit 1
          fi
      - name: Save tested change to this branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html full-catalog/index.html
          git commit -m "Remove periods after hero Ужин and 1001 повод остаться"
          git push origin HEAD:refs/heads/fix/remove-hero-uzhin-dot-20261103
