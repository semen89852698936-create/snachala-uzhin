name: Remove invitation heading final dot
on:
  push:
    branches: [fix/invitation-heading-no-dot-20261103]
    paths: ['.github/workflows/fix-invitation-heading.yml']
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/invitation-heading-no-dot-20261103
          persist-credentials: true
      - name: Remove dot after одного сообщения only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ('index.html', 'full-catalog/index.html'):
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              old = 'одного сообщения.'
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{name}: expected exactly one match, got {count}')
              p.write_text(s.replace(old, 'одного сообщения', 1), encoding='utf-8')
          PY
      - name: Verify scope and commit
        run: |
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' 'full-catalog/index.html' 'index.html')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html full-catalog/index.html
          git commit -m "Remove dot from invitation headline"
          git push origin HEAD:refs/heads/fix/invitation-heading-no-dot-20261103
