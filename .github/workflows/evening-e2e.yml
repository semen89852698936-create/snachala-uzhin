name: Browser smoke - Our Evening
on:
  push:
    branches:
      - feature/nash-vecher-separate-screen
    paths:
      - index.html
      - scripts/e2e-evening.cjs
      - .github/workflows/evening-e2e.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Playwright version
        run: npm install --no-package-lock --no-save playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/evening-http.log 2>&1 &
          node scripts/e2e-evening.cjs
      - name: Upload screenshot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: our-evening-screenshots
          path: /tmp/evening-*.png
          if-no-files-found: ignore
