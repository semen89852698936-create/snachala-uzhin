name: Verify Our Evening recipe photo parity
on:
  push:
    branches: ['fix/evening-ideas-photo-parity-20261102']
    paths:
      - 'index.html'
      - 'scripts/test_our_evening_inspiration.py'
      - '.github/workflows/verify-evening-photo-parity.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'scripts/test_our_evening_inspiration.py'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify photo paths and their correspondence to actual recipes
        run: python3 -m unittest discover -s scripts -p 'test_our_evening_inspiration.py' -v
