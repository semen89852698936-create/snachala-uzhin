name: Verify independent sales landing
on:
  push:
    branches:
      - feature/snachala-uzhin-sales-landing-20261103
    paths:
      - 'landing.html'
      - 'scripts/test_sales_landing.py'
      - '.github/workflows/verify-sales-landing.yml'
  pull_request:
    paths:
      - 'landing.html'
      - 'scripts/test_sales_landing.py'
      - '.github/workflows/verify-sales-landing.yml'
permissions:
  contents: read
jobs:
  static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Verify copy, existing image assets and all links
        run: python3 scripts/test_sales_landing.py
