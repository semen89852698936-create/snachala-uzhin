name: Apply approved Our Evening story and verify
on:
  push:
    branches: [feature/evening-approved-story-2026-11]
    paths:
      - 'scripts/apply-approved-evening-story.py'
      - 'scripts/test-approved-story.cjs'
      - '.github/workflows/approved-evening-story.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: approved-evening-story
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout dedicated feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feature/evening-approved-story-2026-11
          fetch-depth: 0
      - name: Apply image and typography design
        run: python3 scripts/apply-approved-evening-story.py
      - name: Test original catalog and layout
        run: python3 -m unittest discover -s scripts -p test_evening_layout.py -v
      - name: Check all JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          count=0
          for attrs,js in re.findall(r'<script([^>]*)>(.*?)</script>',s,flags=re.S):
              if 'application/json' in attrs or 'src=' in attrs or not js.strip():continue
              count+=1
              Path(f'/tmp/our-evening-js-{count}.js').write_text(js,encoding='utf-8')
          print("Checked JavaScript blocks:",count)
          PY
          for f in /tmp/our-evening-js-*.js; do node --check "$f"; done
      - name: Install browser testing
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test navigation and responsive approved design
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/story-http.log 2>&1 &
          node scripts/e2e-evening.cjs
          node scripts/test-approved-story.cjs
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: approved-evening-story-screenchecks
          path: /tmp/our-evening-*.png
          if-no-files-found: ignore
      - name: Commit applied approved design, do not publish automatically
        shell: bash
        run: |
          set -euo pipefail
          git add index.html
          if ! git diff --cached --quiet; then
            git -c user.name='approved-layout[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Apply approved three-scene design to existing site'
            git push origin HEAD:refs/heads/feature/evening-approved-story-2026-11
          fi
