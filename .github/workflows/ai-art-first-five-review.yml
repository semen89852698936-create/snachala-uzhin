name: AI ART editorial release gate (offline, no paid calls)
on:
  pull_request:
    paths:
      - 'review/ai-art-first-five-visual-triage-20261102.json'
      - 'tests/ai-art-first-five-review.test.mjs'
      - 'tests/ai-art-library-release-gate.test.mjs'
      - 'review/ai-art-six-to-ten-visual-triage-20261102.json'
      - 'tests/ai-art-six-to-ten-review.test.mjs'
      - 'photo-library/ai-art-replacement-briefs-8-9-20261102.json'
      - 'photo-library/ai-art-replacement-brief-5-20261102.json'
      - 'tests/ai-art-rejected-replacement-coverage.test.mjs'
      - '.github/workflows/ai-art-first-five-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: node --test tests/ai-art-first-five-review.test.mjs tests/ai-art-library-release-gate.test.mjs tests/ai-art-six-to-ten-review.test.mjs tests/ai-art-rejected-replacement-coverage.test.mjs
