name: Alice AI ART 3.0 - fix chicken meatballs poultry 168
on:
  push:
    branches:
      - photo-production/alice-art-poultry-168-v2-20261115
    paths:
      - .github/workflows/alice-art-poultry-168-v2-20261115.yml
permissions:
  contents: write
concurrency:
  group: alice-art-poultry-168-v2-20261115
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: photo-production/alice-art-poultry-168-v2-20261115
          fetch-depth: 0
          persist-credentials: true
      - name: Read original Alice AI ART 3.0 adapter and recipe IDs
        uses: actions/checkout@v4
        with:
          repository: semen89852698936-create/snachala-uzhin
          ref: photo-production/yandex-ai-art-1001
          path: _photo_source
          sparse-checkout: |
            photo-pipeline
            photo-library/recipes.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet 'Pillow>=10,<13'
      - name: One review-only Alice AI ART 3.0 candidate
        shell: bash
        env:
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID || 'b1g00u8p0k5nl98v8nre' }}
          PHOTO_COST_APPROVED: 'true'
        run: |
          set -euo pipefail
          test -n "${YANDEX_API_KEY:-}"
          test -n "${YANDEX_FOLDER_ID:-}"
          python3 photo-library/alice-art-poultry-168-v2-20261115/run_one.py
