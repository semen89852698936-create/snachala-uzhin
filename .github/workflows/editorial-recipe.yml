name: Editorial recipe cooking test - no new step photos
on:
  pull_request:
    paths:
      - 'assets/editorial-recipe.css'
      - 'assets/editorial-recipe.js'
      - 'index.html'
      - 'full-catalog/index.html'
      - 'scripts/e2e-editorial-recipe.cjs'
      - '.github/workflows/editorial-recipe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Live-browser desktop and phone, both 1001-recipe HTML variants
        run: |
          python3 -m http.server 8769 --bind 127.0.0.1 >/tmp/recipe-editorial-http.log 2>&1 &
          sleep 2
          node scripts/e2e-editorial-recipe.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: editorial-recipe-real-browser
          path: exports/recipe-editorial-*.png
          if-no-files-found: ignore
