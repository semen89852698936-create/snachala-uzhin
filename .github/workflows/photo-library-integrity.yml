name: Photo library integrity (100 WebP)
on:
  pull_request:
    paths:
      - 'photo-library/**'
      - 'assets/recipes/**'
      - 'scripts/validate-photo-library.mjs'
      - '.github/workflows/photo-library-integrity.yml'
  push:
    branches:
      - 'photo-library/**'
    paths:
      - 'photo-library/**'
      - 'assets/recipes/**'
      - 'scripts/validate-photo-library.mjs'
      - '.github/workflows/photo-library-integrity.yml'
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check files, SHA256, source manifest, gallery, curated links
        run: node scripts/validate-photo-library.mjs
