name: Photo candidates 21-120 (review only)
on:
  push:
    branches:
      - photo-batch-21-120
    paths:
      - 'scripts/build_photo_candidates_21_120.py'
      - 'scripts/make_photo_contact_sheet.py'
      - '.github/workflows/photo-candidates-21-120.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install photo tooling
        run: python -m pip install --disable-pip-version-check pillow requests
      - name: Find distinct photographs and produce real WebP files
        run: python scripts/build_photo_candidates_21_120.py
      - name: Build visual review contact sheet
        run: python scripts/make_photo_contact_sheet.py
      - name: Publish candidates to review branch ONLY
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photo-library/candidates-21-120/
          if ! git diff --cached --quiet; then
            git commit -m "[skip ci] Add unreviewed licensed photo candidates 21-120"
            git push origin HEAD:photo-batch-21-120
          fi
      - name: Archive files and manifest for review
        uses: actions/upload-artifact@v4
        with:
          name: snachala-uzhin-webp-candidates-21-120
          path: photo-library/candidates-21-120/
          retention-days: 30
