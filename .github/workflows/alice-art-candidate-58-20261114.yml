name: Alice AI ART - isolated approved-series candidate 58
on:
  push:
    branches:
      - photo-production/alice-art-approved-series-58-20261114
    paths:
      - '.github/workflows/alice-art-candidate-58-20261114.yml'
permissions:
  contents: write
concurrency:
  group: alice-art-one-shot-photo-58-20261114
  cancel-in-progress: false
jobs:
  generate-one:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout working branch only
        uses: actions/checkout@v4
        with:
          ref: photo-production/alice-art-approved-series-58-20261114
          persist-credentials: true
          fetch-depth: 0
      - name: Checkout existing Alice AI ART adapter read-only
        uses: actions/checkout@v4
        with:
          repository: semen89852698936-create/snachala-uzhin
          ref: photo-production/yandex-ai-art-1001
          path: _photo_source
          sparse-checkout: |
            photo-pipeline
            photo-library/recipes.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet 'Pillow>=10,<13'
      - name: Exactly one paid Alice AI ART request, checkpointed before API call
        shell: bash
        env:
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID || 'b1g00u8p0k5nl98v8nre' }}
          PHOTO_COST_APPROVED: 'true'
        run: |
          set -euo pipefail
          test -n "${YANDEX_API_KEY:-}"
          test -n "${YANDEX_FOLDER_ID:-}"
          python3 - <<'PY'
          import hashlib, importlib.util, json, os, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          base=Path("photo-library/alice-art-oneoff-58-20261114")
          marker=base/"request.json"
          candidate=base/"0058-collection-meat-09-03.webp"
          record=base/"0058-collection-meat-09-03.json"
          if candidate.exists() and record.exists():
              obj=json.loads(record.read_text(encoding="utf-8"))
              assert hashlib.sha256(candidate.read_bytes()).hexdigest()==obj["sha256"]
              print("ALREADY_GENERATED: no new paid request")
              raise SystemExit(0)
          assert not candidate.exists() and not record.exists(), "partial candidate requires manual recovery"
          doc=json.loads(marker.read_text(encoding="utf-8"))
          assert doc["status"]=="reserved_not_sent", "Paid request previously started: no automatic retry"
          assert doc["photo_number"]==58 and doc["recipe_id"]=="collection-meat-09-03"
          assert os.environ.get("PHOTO_COST_APPROVED")=="true"
          assert 1<=len(doc["prompt"])<=500
          manifest=json.loads(Path("_photo_source/photo-library/recipes.json").read_text(encoding="utf-8"))
          matches=[r for r in manifest["recipes"] if r["id"]==doc["recipe_id"]]
          assert len(matches)==1 and matches[0]["title"]==doc["title"], "Recipe mismatch; stop before paid call"
          spec=importlib.util.spec_from_file_location("alice_yandex_adapter","_photo_source/photo-pipeline/generate_yandexart.py")
          ym=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(ym)
          def git(*args):
              subprocess.run(["git", *args], check=True)
          git("config","user.name","github-actions[bot]")
          git("config","user.email","41898282+github-actions[bot]@users.noreply.github.com")
          doc["status"]="paid_request_started_no_auto_retry"
          doc["started_at"]=datetime.now(timezone.utc).isoformat()
          ym.atomic_write(marker,json.dumps(doc,ensure_ascii=False,indent=2).encode("utf-8"))
          git("add",str(marker))
          git("commit","-m","Alice AI ART: checkpoint one-shot paid request 58 before call")
          git("push","origin","HEAD:refs/heads/photo-production/alice-art-approved-series-58-20261114")
          raw=ym.request_image(doc["prompt"],os.environ["YANDEX_API_KEY"],os.environ["YANDEX_FOLDER_ID"])
          webp=ym.encode_webp(raw)
          digest=hashlib.sha256(webp).hexdigest()
          ym.atomic_write(candidate,webp)
          item={"photo_number":58,"recipe_id":doc["recipe_id"],"title":doc["title"],
                "model":doc["model"],"prompt":doc["prompt"],
                "sha256":digest,"bytes":len(webp),"size":[1200,900],
                "status":"candidate_owner_approval_required","site_published":False,
                "created_at":datetime.now(timezone.utc).isoformat()}
          ym.atomic_write(record,json.dumps(item,ensure_ascii=False,indent=2).encode("utf-8"))
          doc["status"]="candidate_saved_not_published"
          doc["result_sha256"]=digest
          ym.atomic_write(marker,json.dumps(doc,ensure_ascii=False,indent=2).encode("utf-8"))
          git("add",str(base))
          git("diff","--cached","--check")
          git("commit","-m","Alice AI ART: save one candidate for owner review, photo 58")
          git("push","origin","HEAD:refs/heads/photo-production/alice-art-approved-series-58-20261114")
          print("ALICE_CANDIDATE_58_SAVED",digest,len(webp))
          PY
