name: Alice AI ART - soup 09 candidate
on:
  push:
    branches:
      - photo-production/alice-art-soup-09-20261119
    paths:
      - .github/workflows/alice-art-soup-09.yml
      - photo-pipeline/generate_soup09.py
permissions:
  contents: write
concurrency:
  group: alice-soup-09-one-shot
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: photo-production/alice-art-soup-09-20261119
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Generate exactly one reserved paid Alice AI ART photo
        env:
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID || 'b1g00u8p0k5nl98v8nre' }}
          PHOTO_COST_APPROVED: 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python photo-pipeline/generate_soup09.py
