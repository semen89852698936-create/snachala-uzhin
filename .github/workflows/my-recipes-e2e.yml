name: My Recipes and ingredient search E2E
on:
  pull_request:
    paths:
      - 'index.html'
      - 'full-catalog/index.html'
      - 'scripts/e2e-my-recipes-and-search.cjs'
      - '.github/workflows/my-recipes-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  my-recipes-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Desktop/mobile browser regression
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/snachala-uzhin-http.log 2>&1 &
          for i in {1..20}; do curl -fsS -o /dev/null http://127.0.0.1:8765/ && break || sleep 1; done
          node scripts/e2e-my-recipes-and-search.cjs
