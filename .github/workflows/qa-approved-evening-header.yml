name: 11 Nov approved Our Evening header screenshot QA
on:
  push:
    branches:
      - fix/evening-back-paper-button-20261111
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshot-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-package-lock --no-save playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser capture of real page and public Vercel deployment
        shell: bash
        env:
          EVENING_PUBLIC_PREVIEW: https://snachala-uzhin-preview-6kii7yosi-chaika2.vercel.app/
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/evening-http.log 2>&1 &
          sleep 2
          node scripts/qa-approved-evening-header.cjs
      - name: Upload real browser screenshots and layout metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: approved-evening-header-20261111-browser
          path: |
            /tmp/approved-evening-*.png
            /tmp/approved-evening-*.json
          if-no-files-found: error
